name: Sync and Convert Venera Sources

on:
  schedule:
    # 每天 UTC 0点运行 (北京时间早上 8:00 自动同步)
    - cron: '0 0 * * *' 
  workflow_dispatch: # 允许在 GitHub 网页端手动点击触发

jobs:
  sync-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予 Action 将新文件推送到你仓库的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run conversion script
        run: python convert.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add venera-next-sources.json
          
          # 只有当文件内容真正发生变化时才提交，避免产生无意义的 commit
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto sync venera-app/venera-configs"
            git push
          else
            echo "🟢 官方源无变动，无需提交。"
          fi
